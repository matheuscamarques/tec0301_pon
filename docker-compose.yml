# Apenas o banco TimescaleDB (artigo 07 §4.2).
# Uso: docker compose up -d
# Depois, no host: cd apps/simulacoes_visuais && mix ecto.create && mix ecto.migrate && mix phx.server

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: tec0301_pon_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simulacoes_visuais_dev
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simulacoes_visuais_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  timescaledb_data:
