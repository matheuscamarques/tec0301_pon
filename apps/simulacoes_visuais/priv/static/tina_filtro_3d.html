<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <title>Digital Twin 3D - Tina de Filtro Detalhada</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }

        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 1.5rem; box-sizing: border-box;
        }
        .panel {
            background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(8px);
            border: 1px solid rgba(71, 85, 105, 0.8); border-radius: 12px;
            padding: 1rem; pointer-events: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .data-row { display: flex; justify-content: space-between; font-family: monospace; font-size: 0.85rem; margin-top: 0.5rem; color: #cbd5e1; border-bottom: 1px solid #334155; padding-bottom: 0.2rem;}
        .val { color: #10b981; font-weight: bold; }
        .val-warn { color: #f59e0b; font-weight: bold; }
        .val-alert { color: #ef4444; font-weight: bold; }
        .val-blue { color: #3b82f6; font-weight: bold; }
    </style>
</head>
<body>

    <div id="hud">
        <div class="flex justify-between items-start">
            <div class="panel max-w-sm">
                <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-amber-500 animate-pulse"></span>
                    Tina de Filtro 3D
                </h1>
                <p class="text-slate-400 text-xs mt-1">Foco Detalhado (FBE_03). Clique no equipamento para ler a telemetria.</p>
            </div>

            <div class="panel">
                <h2 class="text-white font-bold text-sm mb-2 border-b border-slate-600 pb-1">STATUS DA FILTRAÇÃO</h2>
                <div class="data-row"><span>Estado Geral:</span> <span class="val">LAUTERING</span></div>
                <div class="data-row"><span>Velocidade Bomba:</span> <span class="val"><span id="hud-pump">67</span> rpm</span></div>
                <div class="data-row border-0"><span>Pressão Dif.:</span> <span class="val-warn"><span id="hud-press">59</span> mbar</span></div>
            </div>
        </div>

        <div class="flex justify-end items-end">
            <div id="details-panel" class="panel w-80" style="opacity: 0.5;">
                <h2 class="text-white font-bold text-sm mb-2 border-b border-slate-600 pb-1 flex justify-between">
                    <span id="eq-name">Inspecionar Equipamento</span>
                    <span id="eq-status" class="text-xs text-slate-400">---</span>
                </h2>
                <div id="eq-data-container">
                    <div class="text-slate-400 text-xs italic py-4 text-center">Clique na tina para ver os dados.</div>
                </div>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        (function() {
            var FBE_ID = 3;
            var HUD_MAP = {};
            function escapeHtml(s) { if (!s) return ""; var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
            window.addEventListener("message", function(e) {
                if (e.origin !== window.location.origin || !e.data || e.data.type !== "fbe_facts" || e.data.fbeId !== FBE_ID) return;
                var facts = e.data.facts || [];
                var c = document.getElementById("eq-data-container");
                if (c) {
                    var html = "";
                    for (var i = 0; i < facts.length; i++) {
                        html += "<div class=\"data-row\"><span>" + escapeHtml(facts[i].label) + "</span> <span class=\"val\">" + escapeHtml(facts[i].value) + "</span></div>";
                    }
                    c.innerHTML = html || "<div class=\"text-slate-400 text-xs italic py-4 text-center\">Dados em tempo real (Smart Brewery).</div>";
                }
                for (var j = 0; j < facts.length; j++) {
                    var id = HUD_MAP[facts[j].label];
                    if (id) { var el = document.getElementById(id); if (el) el.textContent = facts[j].value; }
                }
            });
        })();
        window.onload = function () {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

            const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(35, 22, 38);

            const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.01;
            controls.target.set(0, 8, 0);

            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let hoveredObject = null;
            let selectedObject = null;
            const interactables = [];

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(20, 40, 30);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);
            const blueLight = new THREE.PointLight(0x3b82f6, 1.0, 50);
            blueLight.position.set(-20, 15, 20);
            scene.add(blueLight);
            const orangeLight = new THREE.PointLight(0xf97316, 1.2, 50);
            orangeLight.position.set(20, 10, -20);
            scene.add(orangeLight);

            const matFloor = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8, metalness: 0.2 });
            const matCopper = new THREE.MeshStandardMaterial({ color: 0xc25e1a, roughness: 0.3, metalness: 0.75 });
            const matSteel = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.3, metalness: 0.8 });
            const matDarkSteel = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.6, metalness: 0.5 });
            const matMotorBlue = new THREE.MeshStandardMaterial({ color: 0x1d4ed8, roughness: 0.5, metalness: 0.3 });
            const matGlass = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.25, roughness: 0.1, metalness: 0.9 });
            const matWort = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.2, transparent: true, opacity: 0.85 });

            const floor = new THREE.Mesh(new THREE.CylinderGeometry(22, 22, 1, 64), matFloor);
            floor.position.y = -0.5;
            floor.receiveShadow = true;
            scene.add(floor);
            const gridHelper = new THREE.GridHelper(44, 22, 0x334155, 0x334155);
            scene.add(gridHelper);

            const lauterGroup = new THREE.Group();
            scene.add(lauterGroup);

            const radius = 6.5;
            const bodyHeight = 5.5;
            const bodyY = 5.5;

            const body = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, bodyHeight, 64), matCopper);
            body.position.y = bodyY;
            body.castShadow = true;
            body.receiveShadow = true;
            lauterGroup.add(body);
            const bottom = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius - 0.2, 0.5, 64), matCopper);
            bottom.position.y = bodyY - bodyHeight / 2 - 0.25;
            bottom.castShadow = true;
            lauterGroup.add(bottom);
            const topDome = new THREE.Mesh(new THREE.SphereGeometry(radius, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2.5), matCopper);
            topDome.position.y = bodyY + bodyHeight / 2 - 0.5;
            topDome.castShadow = true;
            lauterGroup.add(topDome);

            const legGeo = new THREE.CylinderGeometry(0.5, 0.4, 3, 16);
            [[4.5, 1.5, 4.5], [-4.5, 1.5, 4.5], [4.5, 1.5, -4.5], [-4.5, 1.5, -4.5], [6, 1.5, 0], [-6, 1.5, 0], [0, 1.5, 6], [0, 1.5, -6]].forEach(pos => {
                const leg = new THREE.Mesh(legGeo, matDarkSteel);
                leg.position.set(...pos);
                leg.castShadow = true;
                const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.2, 16), matDarkSteel);
                foot.position.set(pos[0], 0.1, pos[2]);
                lauterGroup.add(foot);
                lauterGroup.add(leg);
            });

            const rakeMotorGroup = new THREE.Group();
            rakeMotorGroup.position.set(0, topDome.position.y + radius - 1.2, 0);
            const motorBase = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 1, 32), matSteel);
            motorBase.position.y = 0.5;
            motorBase.castShadow = true;
            rakeMotorGroup.add(motorBase);
            const gearbox = new THREE.Mesh(new THREE.BoxGeometry(2, 2.5, 2), matDarkSteel);
            gearbox.position.y = 2.25;
            gearbox.castShadow = true;
            rakeMotorGroup.add(gearbox);
            const motor = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 2.5, 32), matMotorBlue);
            motor.rotation.z = Math.PI / 2;
            motor.position.set(1.5, 2.25, 0);
            motor.castShadow = true;
            rakeMotorGroup.add(motor);
            const shaftGeo = new THREE.CylinderGeometry(0.3, 0.3, 1.5, 16);
            const motorShaft = new THREE.Mesh(shaftGeo, matSteel);
            motorShaft.position.set(0, 4.25, 0);
            motorShaft.castShadow = true;
            rakeMotorGroup.add(motorShaft);
            lauterGroup.add(rakeMotorGroup);

            const spargePipe = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 4, 16), matSteel);
            spargePipe.position.set(-3.5, topDome.position.y + 3, 0);
            spargePipe.rotation.z = Math.PI / 2;
            spargePipe.castShadow = true;
            const spargeElbow = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), matSteel);
            spargeElbow.position.set(-1.5, topDome.position.y + 3, 0);
            const spargeDown = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.5, 16), matSteel);
            spargeDown.position.set(-1.5, topDome.position.y + 2.25, 0);
            lauterGroup.add(spargePipe, spargeElbow, spargeDown);

            const grainDoorGroup = new THREE.Group();
            grainDoorGroup.position.set(0, bodyY - 1.5, radius);
            const doorFrame = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.2, 0.4), matDarkSteel);
            doorFrame.castShadow = true;
            grainDoorGroup.add(doorFrame);
            const grainDoor = new THREE.Mesh(new THREE.BoxGeometry(2.8, 1.8, 0.4), matSteel);
            grainDoor.position.z = 0.1;
            grainDoor.castShadow = true;
            grainDoorGroup.add(grainDoor);
            const latch = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.8, 8), matDarkSteel);
            latch.rotation.z = Math.PI / 2;
            latch.position.set(1.2, 0, 0.35);
            grainDoorGroup.add(latch);
            const chute = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.2, 2), matSteel);
            chute.position.set(0, -1.2, 1);
            chute.rotation.x = Math.PI / 12;
            chute.castShadow = true;
            grainDoorGroup.add(chute);
            lauterGroup.add(grainDoorGroup);

            const grantGroup = new THREE.Group();
            grantGroup.position.set(radius + 1, 3.5, 2);
            const grantBase = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.2, 32), matSteel);
            grantBase.position.y = -1;
            grantGroup.add(grantBase);
            const grantTop = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.2, 32), matSteel);
            grantTop.position.y = 1;
            grantGroup.add(grantTop);
            const grantGlass = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 2, 32), matGlass);
            grantGroup.add(grantGlass);
            const grantLiquid = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.65, 1.5, 32), matWort);
            grantLiquid.position.y = -0.25;
            grantGroup.add(grantLiquid);
            const pipeToGrant = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.5, 16), matSteel);
            pipeToGrant.rotation.z = Math.PI / 2;
            pipeToGrant.position.set(-0.8, -0.5, 0);
            grantGroup.add(pipeToGrant);
            lauterGroup.add(grantGroup);

            const pumpGroup = new THREE.Group();
            pumpGroup.position.set(0, 1.5, 0);
            const pumpPipe = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 2, 16), matSteel);
            pumpPipe.position.y = 0.5;
            pumpGroup.add(pumpPipe);
            const pumpMotor = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 1.5, 16), matMotorBlue);
            pumpMotor.rotation.z = Math.PI / 2;
            pumpMotor.position.set(1, -0.5, 0);
            pumpMotor.castShadow = true;
            pumpGroup.add(pumpMotor);
            const pumpVolute = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), matDarkSteel);
            pumpVolute.position.set(0, -0.5, 0);
            pumpGroup.add(pumpVolute);
            lauterGroup.add(pumpGroup);

            const hitBoxGeo = new THREE.BoxGeometry(15, 20, 15);
            const hitBoxMat = new THREE.MeshBasicMaterial({ visible: false });
            const lauterHitBox = new THREE.Mesh(hitBoxGeo, hitBoxMat);
            lauterHitBox.position.y = 10;
            lauterHitBox.userData = {
                id: "fbe03",
                name: "Tina de Filtro (Lauter)",
                data: {
                    "Pressão Diferencial": "59 mbar",
                    "Clareza do Mosto": "22%",
                    "Temp. Água Lavagem": "73 °C",
                    "Altura do Rake": "64%",
                    "Veloc. da Bomba": "67 rpm"
                },
                isHighlighted: false
            };
            interactables.push(lauterHitBox);
            scene.add(lauterHitBox);

            const outlineGeo = new THREE.EdgesGeometry(hitBoxGeo);
            const outlineMat = new THREE.LineBasicMaterial({ color: 0x3b82f6, linewidth: 2, transparent: true, opacity: 0 });
            const outline = new THREE.LineSegments(outlineGeo, outlineMat);
            outline.position.y = 10;
            scene.add(outline);

            function safeId(key) { return key.replace(/[^a-zA-Z0-9]/g, ''); }

            function onMouseMove(event) {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            }

            function clearDetailsPanel() {
                var panel = document.getElementById('details-panel');
                var eqName = document.getElementById('eq-name');
                var eqStatus = document.getElementById('eq-status');
                var eqData = document.getElementById('eq-data-container');
                if (panel) panel.style.opacity = '0.5';
                if (eqName) eqName.innerText = "Inspecionar Equipamento";
                if (eqStatus) { eqStatus.innerText = "---"; eqStatus.className = "text-xs text-slate-400"; }
                if (eqData) eqData.innerHTML = '<div class="text-slate-400 text-xs italic py-4 text-center">Clique na tina para ver os dados.</div>';
            }

            function onClick(event) {
                if (hoveredObject) {
                    selectedObject = hoveredObject;
                    updateHUDDetails(selectedObject.userData);
                } else {
                    selectedObject = null;
                    outline.material.opacity = 0;
                    clearDetailsPanel();
                }
            }

            window.addEventListener('mousemove', onMouseMove, false);
            window.addEventListener('click', onClick, false);

            function updateHUDDetails(userData) {
                var panel = document.getElementById('details-panel');
                var eqName = document.getElementById('eq-name');
                var eqStatus = document.getElementById('eq-status');
                var eqData = document.getElementById('eq-data-container');
                if (!userData || !eqName || !eqStatus || !eqData) return;
                if (panel) panel.style.opacity = '1';
                eqName.innerText = userData.name;
                var html = '';
                for (var key in userData.data) {
                    if (!userData.data.hasOwnProperty(key)) continue;
                    var value = userData.data[key];
                    var valClass = "val";
                    if (key === "Pressão Diferencial" && parseInt(value, 10) > 50) valClass = "val-warn";
                    if (key === "Clareza do Mosto" && parseInt(value, 10) < 30) valClass = "val-warn";
                    html += '<div class="data-row"><span>' + key + ':</span> <span class="' + valClass + '" id="dyn-' + safeId(key) + '">' + value + '</span></div>';
                }
                eqStatus.innerText = "LAUTERING";
                eqStatus.className = "text-xs text-amber-500 font-bold";
                eqData.innerHTML = html;
            }

            function animate() {
                requestAnimationFrame(animate);
                controls.update();

                raycaster.setFromCamera(mouse, camera);
                var intersects = raycaster.intersectObjects(interactables);
                if (intersects.length > 0) {
                    if (hoveredObject !== intersects[0].object) {
                        hoveredObject = intersects[0].object;
                        document.body.style.cursor = 'pointer';
                        if (!selectedObject) outline.material.opacity = 0.3;
                    }
                } else {
                    hoveredObject = null;
                    document.body.style.cursor = 'default';
                    if (!selectedObject) outline.material.opacity = 0;
                }
                if (selectedObject) outline.material.opacity = 0.8;

                motorShaft.rotation.y += 0.05;
                grantLiquid.scale.y = 1 + Math.sin(Date.now() * 0.005) * 0.05;

                renderer.render(scene, camera);
            }

            animate();

            window.addEventListener('resize', function () {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }, false);

            setInterval(function () {
                var currentPump = 67 + Math.floor(Math.random() * 4 - 2);
                var currentPress = 59 + Math.floor(Math.random() * 4 - 2);
                var hudPump = document.getElementById('hud-pump');
                var hudPress = document.getElementById('hud-press');
                if (hudPump) hudPump.innerText = currentPump;
                if (hudPress) hudPress.innerText = currentPress;

                if (selectedObject) {
                    var elPress = document.getElementById('dyn-PressoDiferencial');
                    if (elPress) elPress.innerText = currentPress + " mbar";
                    var elPump = document.getElementById('dyn-VelocdaBomba');
                    if (elPump) elPump.innerText = currentPump + " rpm";
                    var elClarity = document.getElementById('dyn-ClarezadoMosto');
                    if (elClarity) {
                        var clarity = 22 + Math.floor(Math.random() * 3);
                        elClarity.innerText = clarity + "%";
                    }
                }
            }, 2000);
        };
    </script>
</body>
</html>
