<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Fábrica de Cerveja Inteligente - Esquema Integrado (Animado)</title>
    <style>
        /* ================= ANIMAÇÕES GERAIS ================= */
        @keyframes flow-grain { 0% { stroke-dashoffset: 20; } 100% { stroke-dashoffset: 0; } }
        @keyframes flow-hot { 0% { stroke-dashoffset: 24; } 100% { stroke-dashoffset: 0; } }
        @keyframes flow-cold { 0% { stroke-dashoffset: 24; } 100% { stroke-dashoffset: 0; } }
        @keyframes flow-cip { 0% { stroke-dashoffset: 20; } 100% { stroke-dashoffset: 0; } }
        @keyframes flow-power { 0% { stroke-dashoffset: 16; } 100% { stroke-dashoffset: 0; } }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes spin-reverse { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
        @keyframes steam-rise { 0% { transform: translateY(0) scale(1); opacity: 0.8; } 100% { transform: translateY(-30px) scale(1.5); opacity: 0; } }

        /* ================= ANIMAÇÕES DE REALISMO AVANÇADO ================= */
        @keyframes liquid-level {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.96); }
        }
        @keyframes boil-bubble {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-40px) scale(1.2); opacity: 0; }
        }
        @keyframes co2-bubble {
            0% { transform: translateY(0) scale(0.3); opacity: 0; }
            30% { opacity: 0.8; }
            100% { transform: translateY(-60px) scale(1.5); opacity: 0; }
        }
        @keyframes bottle-move {
            0% { transform: translateX(-40px); }
            100% { transform: translateX(0px); }
        }
        @keyframes amr-patrol {
            0% { transform: translate(30px, 45px); }
            45% { transform: translate(190px, 45px); }
            50% { transform: translate(190px, 45px); }
            95% { transform: translate(30px, 45px); }
            100% { transform: translate(30px, 45px); }
        }
        @keyframes grain-fall {
            0% { transform: translateY(-10px); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(40px); opacity: 0; }
        }
        @keyframes filler-plunge {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(12px); }
        }
        @keyframes fire-pulse {
            0%, 100% { transform: scaleY(1); opacity: 0.8; }
            50% { transform: scaleY(1.3); opacity: 1; }
        }
        @keyframes led-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Classes Utilitárias de Animação */
        .path-grain { stroke: #d97706; stroke-dasharray: 6, 4; animation: flow-grain 0.8s linear infinite; }
        .path-hot { stroke: #ef4444; stroke-dasharray: 12, 6; animation: flow-hot 0.8s linear infinite; }
        .path-cold { stroke: #3b82f6; stroke-dasharray: 12, 6; animation: flow-cold 1.2s linear infinite; }
        .path-cip { stroke: #22c55e; stroke-dasharray: 10, 5; animation: flow-cip 1.5s linear infinite; }
        .path-power { stroke: #eab308; stroke-dasharray: 4, 4; animation: flow-power 0.5s linear infinite; }

        .spin-slow { transform-origin: center; transform-box: fill-box; animation: spin 4s linear infinite; }
        .spin-fast { transform-origin: center; transform-box: fill-box; animation: spin 1s linear infinite; }
        .spin-rev-fast { transform-origin: center; transform-box: fill-box; animation: spin-reverse 1s linear infinite; }
        .steam { animation: steam-rise 2s infinite ease-out; }

        .liquid-anim { transform-origin: bottom center; transform-box: fill-box; animation: liquid-level 3s ease-in-out infinite; }
        .bubble { animation: boil-bubble 1.5s infinite ease-in; }
        .co2 { animation: co2-bubble 2.5s infinite ease-in; }
        .grain-particle { animation: grain-fall 0.6s linear infinite; }

        .conveyor-run { animation: bottle-move 1.5s linear infinite; }
        .amr-run { animation: amr-patrol 12s ease-in-out infinite; }
        .filler-run { animation: filler-plunge 1.5s ease-in-out infinite; }
        .fire-glow { transform-origin: bottom center; transform-box: fill-box; animation: fire-pulse 0.4s infinite alternate; }
        .live-led { animation: led-blink 1s infinite; }

        /* Estilos de Interatividade */
        .interactive-group { transition: transform 0.3s ease, filter 0.3s ease; transform-origin: center; cursor: pointer; }
        .interactive-group:hover { transform: scale(1.05); filter: drop-shadow(0px 0px 8px rgba(59, 130, 246, 0.5)); z-index: 10; }

        /* Estilos de Texto SVG */
        .data-label { font-family: monospace; font-size: 10px; fill: #94a3b8; }
        .data-value { font-family: monospace; font-size: 11px; fill: #10b981; font-weight: bold; transition: all 0.2s; }
        .data-value.updated { fill: #fff; text-shadow: 0 0 5px #10b981; }
        .data-alert { font-family: monospace; font-size: 11px; fill: #ef4444; font-weight: bold; }
        .data-warn { font-family: monospace; font-size: 11px; fill: #f59e0b; font-weight: bold; }
        .eq-title { font-family: sans-serif; font-size: 12px; fill: #f8fafc; font-weight: bold; pointer-events: none; }

        .custom-scrollbar::-webkit-scrollbar { height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 flex flex-col items-center justify-center min-h-screen p-4">

                <!-- 09. CIP -->
                <g transform="translate(50, 520)" class="interactive-group">
                    <rect x="-10" y="-10" width="280" height="150" rx="8" fill="#1e293b" opacity="0.9"/>

    <script>
        function updateSensors() {
            const rpm = document.getElementById('val-rpm');
            const vib = document.getElementById('val-vib');
            if (rpm) rpm.textContent = 1025 + Math.floor(Math.random() * 8 - 4);
            if (vib) vib.textContent = 55 + Math.floor(Math.random() * 4 - 2);

            const mashTemp = document.getElementById('val-mash-temp');
            const flow = document.getElementById('val-flow');
            if (mashTemp) mashTemp.textContent = (62.0 + (Math.random() * 0.4 - 0.2)).toFixed(1);
            if (flow) flow.textContent = 44 + Math.floor(Math.random() * 3 - 1);

            const press = document.getElementById('val-press');
            const pump = document.getElementById('val-pump');
            if (press) press.textContent = 190 + Math.floor(Math.random() * 6 - 3);
            if (pump) pump.textContent = 24 + Math.floor(Math.random() * 2 - 1);

            const boilTemp = document.getElementById('val-boil-temp');
            const evap = document.getElementById('val-evap');
            if (boilTemp) boilTemp.textContent = (100.0 + (Math.random() * 0.2)).toFixed(1);
            if (evap) evap.textContent = 16 + Math.floor(Math.random() * 2);

            const fermA = document.getElementById('val-ferm-a');
            const fermB = document.getElementById('val-ferm-b');
            if (fermA) fermA.textContent = (17.0 + (Math.random() * 0.2 - 0.1)).toFixed(1);
            if (fermB) fermB.textContent = (2.0 + (Math.random() * 0.2 - 0.1)).toFixed(1);

            const bpm = document.getElementById('val-bpm');
            const cond = document.getElementById('val-cond');
            if (bpm) bpm.textContent = 120 + Math.floor(Math.random() * 4 - 2);
            if (cond) cond.textContent = 88 + Math.floor(Math.random() * 3 - 1);

            const batElem = document.getElementById('val-bat');
            if (batElem) {
                let bat = parseInt(batElem.textContent, 10) || 84;
                if (Math.random() > 0.7 && bat > 10) bat -= 1;
                batElem.textContent = bat;
            }

            const load = document.getElementById('val-load');
            const cost = document.getElementById('val-cost');
            if (load) load.textContent = 245 + Math.floor(Math.random() * 10 - 5);
            if (cost) cost.textContent = 162 + Math.floor(Math.random() * 4 - 2);

            document.querySelectorAll('.data-value').forEach(v => {
                if (Math.random() > 0.5) {
                    v.classList.add('updated');
                    setTimeout(() => v.classList.remove('updated'), 200);
                }
            });
        }
        setInterval(updateSensors, 2000);
    </script>
