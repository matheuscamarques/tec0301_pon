<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <title>Digital Twin 3D - Caldeira de Fervura Detalhada</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }

        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 1.5rem; box-sizing: border-box;
        }
        .panel {
            background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(8px);
            border: 1px solid rgba(71, 85, 105, 0.8); border-radius: 12px;
            padding: 1rem; pointer-events: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .data-row { display: flex; justify-content: space-between; font-family: monospace; font-size: 0.85rem; margin-top: 0.5rem; color: #cbd5e1; border-bottom: 1px solid #334155; padding-bottom: 0.2rem;}
        .val { color: #10b981; font-weight: bold; }
        .val-warn { color: #f59e0b; font-weight: bold; }
        .val-alert { color: #ef4444; font-weight: bold; }
        .val-blue { color: #3b82f6; font-weight: bold; }
        .val-neutral { color: #94a3b8; font-weight: bold; }
    </style>
</head>
<body>

    <div id="hud">
        <div class="flex justify-between items-start">
            <div class="panel max-w-sm">
                <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></span>
                    Caldeira de Fervura 3D
                </h1>
                <p class="text-slate-400 text-xs mt-1">Foco Detalhado (FBE_04). Clique no equipamento para ler a telemetria.</p>
            </div>

            <div class="panel w-64">
                <h2 class="text-white font-bold text-sm mb-2 border-b border-slate-600 pb-1">STATUS DA FERVURA</h2>
                <div class="data-row"><span>Temperatura:</span> <span class="val-warn"><span id="hud-temp">79</span> °C</span></div>
                <div class="data-row"><span>Evaporação:</span> <span class="val"><span id="hud-evap">9</span> %</span></div>
                <div class="data-row border-0"><span>Dosador de Lúpulo:</span> <span class="val-neutral">IDLE</span></div>
            </div>
        </div>

        <div class="flex justify-end items-end">
            <div id="details-panel" class="panel w-80" style="opacity: 0.5;">
                <h2 class="text-white font-bold text-sm mb-2 border-b border-slate-600 pb-1 flex justify-between">
                    <span id="eq-name">Inspecionar Equipamento</span>
                    <span id="eq-status" class="text-xs text-slate-400">---</span>
                </h2>
                <div id="eq-data-container">
                    <div class="text-slate-400 text-xs italic py-4 text-center">Clique na caldeira para ver os dados.</div>
                </div>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        (function() {
            var FBE_ID = 4;
            var HUD_MAP = {};
            function escapeHtml(s) { if (!s) return ""; var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
            window.addEventListener("message", function(e) {
                if (e.origin !== window.location.origin || !e.data || e.data.type !== "fbe_facts" || e.data.fbeId !== FBE_ID) return;
                var facts = e.data.facts || [];
                var c = document.getElementById("eq-data-container");
                if (c) {
                    var html = "";
                    for (var i = 0; i < facts.length; i++) {
                        html += "<div class=\"data-row\"><span>" + escapeHtml(facts[i].label) + "</span> <span class=\"val\">" + escapeHtml(facts[i].value) + "</span></div>";
                    }
                    c.innerHTML = html || "<div class=\"text-slate-400 text-xs italic py-4 text-center\">Dados em tempo real (Smart Brewery).</div>";
                }
                for (var j = 0; j < facts.length; j++) {
                    var id = HUD_MAP[facts[j].label];
                    if (id) { var el = document.getElementById(id); if (el) el.textContent = facts[j].value; }
                }
            });
        })();
        window.onload = function () {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.FogExp2(0x0f172a, 0.012);

            const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(40, 25, 45);

            const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.01;
            controls.target.set(0, 10, 0);

            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let hoveredObject = null;
            let selectedObject = null;
            const interactables = [];

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(20, 50, 30);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);
            const blueLight = new THREE.PointLight(0x3b82f6, 0.8, 60);
            blueLight.position.set(-20, 15, 20);
            scene.add(blueLight);
            const fireLight = new THREE.PointLight(0xf97316, 2.0, 40);
            fireLight.position.set(0, 2, 0);
            scene.add(fireLight);

            const matFloor = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8, metalness: 0.2 });
            const matCopper = new THREE.MeshStandardMaterial({ color: 0xc25e1a, roughness: 0.25, metalness: 0.85 });
            const matSteel = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.3, metalness: 0.8 });
            const matDarkSteel = new THREE.MeshStandardMaterial({ color: 0x27303f, roughness: 0.7, metalness: 0.5 });
            const matBurner = new THREE.MeshBasicMaterial({ color: 0xea580c });

            const floor = new THREE.Mesh(new THREE.CylinderGeometry(20, 20, 1, 64), matFloor);
            floor.position.y = -0.5;
            floor.receiveShadow = true;
            scene.add(floor);
            const gridHelper = new THREE.GridHelper(40, 20, 0x334155, 0x334155);
            scene.add(gridHelper);

            const boilGroup = new THREE.Group();
            scene.add(boilGroup);

            const radius = 5.5;
            const burnerBase = new THREE.Mesh(new THREE.CylinderGeometry(radius + 0.2, radius + 0.2, 4, 32), matDarkSteel);
            burnerBase.position.y = 2;
            burnerBase.castShadow = true;
            boilGroup.add(burnerBase);
            const burnerGlow = new THREE.Mesh(new THREE.CylinderGeometry(radius + 0.3, radius + 0.3, 1.5, 32), matBurner);
            burnerGlow.position.y = 2;
            boilGroup.add(burnerGlow);
            const ventCover = new THREE.Mesh(new THREE.BoxGeometry(3, 2, 0.5), matDarkSteel);
            ventCover.position.set(0, 2, radius + 0.1);
            boilGroup.add(ventCover);

            const bodyHeight = 6;
            const bodyY = 8;
            const body = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, bodyHeight, 64), matCopper);
            body.position.y = bodyY;
            body.castShadow = true;
            body.receiveShadow = true;
            boilGroup.add(body);
            const bottomDome = new THREE.Mesh(new THREE.SphereGeometry(radius, 64, 32, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), matCopper);
            bottomDome.position.y = bodyY - bodyHeight / 2;
            boilGroup.add(bottomDome);
            const topDome = new THREE.Mesh(new THREE.SphereGeometry(radius, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2), matCopper);
            topDome.position.y = bodyY + bodyHeight / 2;
            topDome.castShadow = true;
            boilGroup.add(topDome);

            const chimneyRadius = 0.8;
            const chimneyHeight = 8;
            const chimney = new THREE.Mesh(new THREE.CylinderGeometry(chimneyRadius, chimneyRadius, chimneyHeight, 32), matSteel);
            chimney.position.y = topDome.position.y + radius + (chimneyHeight / 2) - 1.5;
            chimney.castShadow = true;
            boilGroup.add(chimney);
            const chimneyFlange = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 0.4, 32), matDarkSteel);
            chimneyFlange.position.y = topDome.position.y + radius - 1.5;
            boilGroup.add(chimneyFlange);

            const manwayGroup = new THREE.Group();
            manwayGroup.position.set(0, bodyY, radius);
            const manwayCollar = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 0.8, 32), matDarkSteel);
            manwayCollar.rotation.x = Math.PI / 2;
            manwayCollar.castShadow = true;
            const manwayLid = new THREE.Mesh(new THREE.CylinderGeometry(1.7, 1.7, 0.3, 32), matSteel);
            manwayLid.rotation.x = Math.PI / 2;
            manwayLid.position.z = 0.4;
            manwayLid.castShadow = true;
            const manwayHinge = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.8, 0.4), matDarkSteel);
            manwayHinge.position.set(1.6, 0, 0.2);
            manwayGroup.add(manwayCollar, manwayLid, manwayHinge);
            boilGroup.add(manwayGroup);

            const doserGroup = new THREE.Group();
            doserGroup.position.set(-radius + 0.5, topDome.position.y + 1, 2);
            doserGroup.rotation.z = Math.PI / 8;
            const doserHopper = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 0.4, 3, 16), matSteel);
            doserHopper.position.y = 2;
            doserHopper.castShadow = true;
            const doserPipe = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 2, 16), matDarkSteel);
            doserPipe.position.y = -0.5;
            const doserLid = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 0.1, 16), matDarkSteel);
            doserLid.position.y = 3.5;
            doserGroup.add(doserHopper, doserPipe, doserLid);
            boilGroup.add(doserGroup);

            const pipeIn = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 4, 16), matSteel);
            pipeIn.position.set(radius + 1, bodyY - 2, 0);
            pipeIn.rotation.z = Math.PI / 2;
            pipeIn.castShadow = true;
            boilGroup.add(pipeIn);
            const pipeOut = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 3, 16), matSteel);
            pipeOut.position.set(0, 2, -radius - 1);
            pipeOut.rotation.x = Math.PI / 2;
            pipeOut.castShadow = true;
            boilGroup.add(pipeOut);

            const hitBoxGeo = new THREE.BoxGeometry(16, 26, 16);
            const hitBoxMat = new THREE.MeshBasicMaterial({ visible: false });
            const boilHitBox = new THREE.Mesh(hitBoxGeo, hitBoxMat);
            boilHitBox.position.y = 12;
            boilHitBox.userData = {
                id: "fbe04",
                name: "Caldeira de Fervura",
                data: {
                    "Temp. de Fervura": "79 °C",
                    "Pressão do Vapor": "4 bar",
                    "Taxa de Evaporação": "9%",
                    "Dosador de Lúpulo": "IDLE",
                    "Nível de Espuma": "12%"
                },
                isHighlighted: false
            };
            interactables.push(boilHitBox);
            scene.add(boilHitBox);

            const outlineGeo = new THREE.EdgesGeometry(hitBoxGeo);
            const outlineMat = new THREE.LineBasicMaterial({ color: 0xef4444, linewidth: 2, transparent: true, opacity: 0 });
            const outline = new THREE.LineSegments(outlineGeo, outlineMat);
            outline.position.y = 12;
            scene.add(outline);

            const steamGroup = new THREE.Group();
            const steamCount = 40;
            const steamGeo = new THREE.SphereGeometry(1.2, 8, 8);
            const steamMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });
            const chimneyTopY = chimney.position.y + (chimneyHeight / 2);
            for (var i = 0; i < steamCount; i++) {
                var s = new THREE.Mesh(steamGeo, steamMat.clone());
                s.position.set((Math.random() - 0.5) * 1.5, chimneyTopY + Math.random() * 8, (Math.random() - 0.5) * 1.5);
                s.userData = {
                    velocity: Math.random() * 0.08 + 0.04,
                    life: Math.random(),
                    xDrift: (Math.random() - 0.5) * 0.05,
                    zDrift: (Math.random() - 0.5) * 0.05,
                    scaleSpeed: Math.random() * 0.02 + 0.01
                };
                steamGroup.add(s);
            }
            scene.add(steamGroup);

            function safeId(key) { return key.replace(/[^a-zA-Z0-9]/g, ''); }

            function onMouseMove(event) {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            }

            function clearDetailsPanel() {
                var panel = document.getElementById('details-panel');
                var eqName = document.getElementById('eq-name');
                var eqStatus = document.getElementById('eq-status');
                var eqData = document.getElementById('eq-data-container');
                if (panel) panel.style.opacity = '0.5';
                if (eqName) eqName.innerText = "Inspecionar Equipamento";
                if (eqStatus) { eqStatus.innerText = "---"; eqStatus.className = "text-xs text-slate-400"; }
                if (eqData) eqData.innerHTML = '<div class="text-slate-400 text-xs italic py-4 text-center">Clique na caldeira para ver os dados.</div>';
            }

            function onClick(event) {
                if (hoveredObject) {
                    selectedObject = hoveredObject;
                    updateHUDDetails(selectedObject.userData);
                } else {
                    selectedObject = null;
                    outline.material.opacity = 0;
                    clearDetailsPanel();
                }
            }

            window.addEventListener('mousemove', onMouseMove, false);
            window.addEventListener('click', onClick, false);

            function updateHUDDetails(userData) {
                var panel = document.getElementById('details-panel');
                var eqName = document.getElementById('eq-name');
                var eqStatus = document.getElementById('eq-status');
                var eqData = document.getElementById('eq-data-container');
                if (!userData || !eqName || !eqStatus || !eqData) return;
                if (panel) panel.style.opacity = '1';
                eqName.innerText = userData.name;
                var html = '';
                for (var key in userData.data) {
                    if (!userData.data.hasOwnProperty(key)) continue;
                    var value = userData.data[key];
                    var valClass = "val";
                    if (key === "Temp. de Fervura") valClass = "val-warn";
                    if (key === "Dosador de Lúpulo" && value === "IDLE") valClass = "val-neutral";
                    html += '<div class="data-row"><span>' + key + ':</span> <span class="' + valClass + '" id="dyn-' + safeId(key) + '">' + value + '</span></div>';
                }
                eqStatus.innerText = "HEATING";
                eqStatus.className = "text-xs text-orange-400 font-bold";
                eqData.innerHTML = html;
            }

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                var time = Date.now() * 0.005;

                raycaster.setFromCamera(mouse, camera);
                var intersects = raycaster.intersectObjects(interactables);
                if (intersects.length > 0) {
                    if (hoveredObject !== intersects[0].object) {
                        hoveredObject = intersects[0].object;
                        document.body.style.cursor = 'pointer';
                        if (!selectedObject) outline.material.opacity = 0.3;
                    }
                } else {
                    hoveredObject = null;
                    document.body.style.cursor = 'default';
                    if (!selectedObject) outline.material.opacity = 0;
                }
                if (selectedObject) outline.material.opacity = 0.8;

                burnerGlow.scale.x = 1 + Math.sin(time * 2) * 0.02;
                burnerGlow.scale.z = 1 + Math.cos(time * 2) * 0.02;
                fireLight.intensity = 2.0 + Math.sin(time * 3) * 0.5;

                steamGroup.children.forEach(function (s) {
                    s.position.y += s.userData.velocity;
                    s.position.x += s.userData.xDrift;
                    s.position.z += s.userData.zDrift;
                    var currentScale = 1 + (s.userData.life * 2);
                    s.scale.set(currentScale, currentScale, currentScale);
                    s.userData.life += 0.008;
                    s.material.opacity = 0.6 * (1 - s.userData.life);
                    if (s.userData.life >= 1) {
                        s.position.set((Math.random() - 0.5) * 1.5, chimneyTopY, (Math.random() - 0.5) * 1.5);
                        s.userData.life = 0;
                        s.scale.set(1, 1, 1);
                    }
                });

                renderer.render(scene, camera);
            }

            animate();

            window.addEventListener('resize', function () {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }, false);

            setInterval(function () {
                var currentTemp = 79.0 + (Math.random() * 0.4 - 0.2);
                var currentEvap = 9 + Math.floor(Math.random() * 2 - 1);
                var hudTemp = document.getElementById('hud-temp');
                var hudEvap = document.getElementById('hud-evap');
                if (hudTemp) hudTemp.innerText = currentTemp.toFixed(1);
                if (hudEvap) hudEvap.innerText = currentEvap;

                if (selectedObject) {
                    var elTemp = document.getElementById('dyn-TempdeFervura');
                    if (elTemp) elTemp.innerText = currentTemp.toFixed(1) + " °C";
                    var elEvap = document.getElementById('dyn-TaxadeEvaporao');
                    if (elEvap) elEvap.innerText = currentEvap + "%";
                    var elPress = document.getElementById('dyn-PressodoVapor');
                    if (elPress) {
                        var press = 4.0 + (Math.random() * 0.2 - 0.1);
                        elPress.innerText = press.toFixed(1) + " bar";
                    }
                }
            }, 2000);
        };
    </script>
</body>
</html>
