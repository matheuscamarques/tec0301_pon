<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <title>Digital Twin 3D - Tanque de Mostura Detalhado</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }

        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 1.5rem; box-sizing: border-box;
        }
        .panel {
            background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(8px);
            border: 1px solid rgba(71, 85, 105, 0.8); border-radius: 12px;
            padding: 1rem; pointer-events: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .data-row { display: flex; justify-content: space-between; font-family: monospace; font-size: 0.85rem; margin-top: 0.5rem; color: #cbd5e1; border-bottom: 1px solid #334155; padding-bottom: 0.2rem;}
        .val { color: #10b981; font-weight: bold; }
        .val-warn { color: #f59e0b; font-weight: bold; }
        .val-alert { color: #ef4444; font-weight: bold; }
        .val-blue { color: #3b82f6; font-weight: bold; }
    </style>
</head>
<body>

    <div id="hud">
        <div class="flex justify-between items-start">
            <div class="panel max-w-sm">
                <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></span>
                    Tanque de Mostura 3D
                </h1>
                <p class="text-slate-400 text-xs mt-1">Foco Detalhado (FBE_02). Clique no equipamento para ler a telemetria.</p>
            </div>

            <div class="panel">
                <h2 class="text-white font-bold text-sm mb-2 border-b border-slate-600 pb-1">STATUS DA BRASSAGEM</h2>
                <div class="data-row"><span>Estado Geral:</span> <span class="val">MOSTURA (MASH)</span></div>
                <div class="data-row"><span>Agitador:</span> <span class="val">ATIVO</span></div>
                <div class="data-row border-0"><span>Nível (Level):</span> <span class="val-warn">32%</span></div>
            </div>
        </div>

        <div class="flex justify-end items-end">
            <div id="details-panel" class="panel w-80" style="opacity: 0.5;">
                <h2 class="text-white font-bold text-sm mb-2 border-b border-slate-600 pb-1 flex justify-between">
                    <span id="eq-name">Inspecionar Equipamento</span>
                    <span id="eq-status" class="text-xs text-slate-400">---</span>
                </h2>
                <div id="eq-data-container">
                    <div class="text-slate-400 text-xs italic py-4 text-center">Clique no tanque para ver os dados.</div>
                </div>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        (function() {
            var FBE_ID = 2;
            var HUD_MAP = {};
            function escapeHtml(s) { if (!s) return ""; var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
            window.addEventListener("message", function(e) {
                if (e.origin !== window.location.origin || !e.data || e.data.type !== "fbe_facts" || e.data.fbeId !== FBE_ID) return;
                var facts = e.data.facts || [];
                var c = document.getElementById("eq-data-container");
                if (c) {
                    var html = "";
                    for (var i = 0; i < facts.length; i++) {
                        html += "<div class=\"data-row\"><span>" + escapeHtml(facts[i].label) + "</span> <span class=\"val\">" + escapeHtml(facts[i].value) + "</span></div>";
                    }
                    c.innerHTML = html || "<div class=\"text-slate-400 text-xs italic py-4 text-center\">Dados em tempo real (Smart Brewery).</div>";
                }
                for (var j = 0; j < facts.length; j++) {
                    var id = HUD_MAP[facts[j].label];
                    if (id) { var el = document.getElementById(id); if (el) el.textContent = facts[j].value; }
                }
            });
        })();
        window.onload = function () {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

            const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(35, 20, 35);

            const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.01;
            controls.target.set(0, 10, 0);

            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let hoveredObject = null;
            let selectedObject = null;
            const interactables = [];

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(20, 40, 30);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);
            const blueLight = new THREE.PointLight(0x3b82f6, 1.2, 50);
            blueLight.position.set(-20, 15, 20);
            scene.add(blueLight);
            const orangeLight = new THREE.PointLight(0xf97316, 1.5, 50);
            orangeLight.position.set(20, 5, -20);
            scene.add(orangeLight);

            const matFloor = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8, metalness: 0.2 });
            const matCopper = new THREE.MeshStandardMaterial({ color: 0xc25e1a, roughness: 0.25, metalness: 0.85 });
            const matSteel = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.3, metalness: 0.8 });
            const matDarkSteel = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.6, metalness: 0.5 });
            const matMotorBlue = new THREE.MeshStandardMaterial({ color: 0x1d4ed8, roughness: 0.5, metalness: 0.3 });
            const matGlass = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.3, roughness: 0.1 });
            const matLiquid = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.2, transparent: true, opacity: 0.9 });

            const floor = new THREE.Mesh(new THREE.CylinderGeometry(20, 20, 1, 64), matFloor);
            floor.position.y = -0.5;
            floor.receiveShadow = true;
            scene.add(floor);
            const gridHelper = new THREE.GridHelper(40, 20, 0x334155, 0x334155);
            scene.add(gridHelper);

            const mashGroup = new THREE.Group();
            scene.add(mashGroup);

            const radius = 5;
            const bodyHeight = 8;
            const bodyY = 7;

            const body = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, bodyHeight, 64), matCopper);
            body.position.y = bodyY;
            body.castShadow = true;
            body.receiveShadow = true;
            mashGroup.add(body);

            const topDome = new THREE.Mesh(new THREE.SphereGeometry(radius, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2), matCopper);
            topDome.position.y = bodyY + bodyHeight / 2;
            topDome.castShadow = true;
            mashGroup.add(topDome);

            const bottomDome = new THREE.Mesh(new THREE.SphereGeometry(radius, 64, 32, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), matCopper);
            bottomDome.position.y = bodyY - bodyHeight / 2;
            bottomDome.castShadow = true;
            mashGroup.add(bottomDome);

            const legGeo = new THREE.CylinderGeometry(0.4, 0.4, 4, 16);
            [[3.5, 2, 3.5], [-3.5, 2, 3.5], [3.5, 2, -3.5], [-3.5, 2, -3.5]].forEach(pos => {
                const leg = new THREE.Mesh(legGeo, matDarkSteel);
                leg.position.set(...pos);
                leg.castShadow = true;
                const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.2, 16), matDarkSteel);
                foot.position.set(pos[0], 0.1, pos[2]);
                mashGroup.add(foot);
                mashGroup.add(leg);
            });

            const agitatorGroup = new THREE.Group();
            agitatorGroup.position.set(0, topDome.position.y + radius, 0);
            const gearbox = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 1.5, 32), matDarkSteel);
            gearbox.position.y = 0.75;
            gearbox.castShadow = true;
            agitatorGroup.add(gearbox);
            const motor = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 2, 32), matMotorBlue);
            motor.position.y = 2.5;
            motor.castShadow = true;
            agitatorGroup.add(motor);
            const shaftGeo = new THREE.CylinderGeometry(0.2, 0.2, 1, 16);
            const motorShaft = new THREE.Mesh(shaftGeo, matSteel);
            motorShaft.position.y = 3.8;
            motorShaft.castShadow = true;
            const fan = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.1, 0.4), matDarkSteel);
            fan.position.y = 0.4;
            motorShaft.add(fan);
            agitatorGroup.add(motorShaft);
            mashGroup.add(agitatorGroup);

            const gristPipe = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 4, 32), matSteel);
            gristPipe.position.set(-3, topDome.position.y + 2, 0);
            gristPipe.rotation.z = Math.PI / 6;
            gristPipe.castShadow = true;
            const hopperFlange = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 0.2, 32), matDarkSteel);
            hopperFlange.position.set(-3.9, topDome.position.y + 3.6, 0);
            hopperFlange.rotation.z = Math.PI / 6;
            mashGroup.add(hopperFlange);
            mashGroup.add(gristPipe);
            const waterPipe = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 2, 16), matSteel);
            waterPipe.position.set(-2.5, topDome.position.y + 3, 1);
            waterPipe.rotation.x = Math.PI / 2;
            mashGroup.add(waterPipe);

            const manwayBase = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 0.5, 32), matDarkSteel);
            manwayBase.position.set(2, topDome.position.y + 1.5, 2);
            manwayBase.rotation.x = Math.PI / 6;
            manwayBase.rotation.z = -Math.PI / 6;
            manwayBase.castShadow = true;
            const manwayLid = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 0.2, 32), matSteel);
            manwayLid.position.set(2.1, topDome.position.y + 1.8, 2.1);
            manwayLid.rotation.x = Math.PI / 6;
            manwayLid.rotation.z = -Math.PI / 6;
            manwayLid.castShadow = true;
            const manwayHandle = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.4, 1.5), matDarkSteel);
            manwayHandle.position.set(0, 0.2, 0);
            manwayLid.add(manwayHandle);
            mashGroup.add(manwayBase, manwayLid);

            const sightGroup = new THREE.Group();
            sightGroup.position.set(4.8, bodyY, 1.5);
            sightGroup.rotation.y = Math.PI / 4;
            const glassFrame = new THREE.Mesh(new THREE.BoxGeometry(0.8, 7, 0.2), matDarkSteel);
            sightGroup.add(glassFrame);
            const glassTube = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 6.5, 16), matGlass);
            glassTube.position.z = 0.2;
            sightGroup.add(glassTube);
            const liquidLevel = 0.32;
            const maxLiquidH = 6.4;
            const currentLiquidH = maxLiquidH * liquidLevel;
            const liquidTube = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, currentLiquidH, 16), matLiquid);
            liquidTube.position.y = (-maxLiquidH / 2) + (currentLiquidH / 2);
            liquidTube.position.z = 0.2;
            sightGroup.add(liquidTube);
            const connectionTop = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.6, 8), matDarkSteel);
            connectionTop.rotation.x = Math.PI / 2;
            connectionTop.position.set(0, 3.25, -0.2);
            const connectionBot = connectionTop.clone();
            connectionBot.position.set(0, -3.25, -0.2);
            sightGroup.add(connectionTop, connectionBot);
            mashGroup.add(sightGroup);

            const outletPipe = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 2, 16), matSteel);
            outletPipe.position.set(0, 1.5, 0);
            mashGroup.add(outletPipe);
            const valve = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), matDarkSteel);
            valve.position.set(0, 1, 0);
            const valveHandle = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.5, 0.2), new THREE.MeshStandardMaterial({ color: 0xef4444 }));
            valveHandle.position.set(0.6, 0, 0);
            valve.add(valveHandle);
            mashGroup.add(valve);

            const hitBoxGeo = new THREE.BoxGeometry(11, 22, 11);
            const hitBoxMat = new THREE.MeshBasicMaterial({ visible: false });
            const mashHitBox = new THREE.Mesh(hitBoxGeo, hitBoxMat);
            mashHitBox.position.y = 10;
            mashHitBox.userData = {
                id: "fbe02",
                name: "Tanque de Mostura",
                data: {
                    "Temperatura (Mash)": "62.0 °C",
                    "Fluxo de Água": "42 L/min",
                    "Status Agitador": "ON",
                    "Nível de pH": "5.3",
                    "Viscosidade": "19 cP",
                    "Nível do Tanque": "32%"
                },
                isHighlighted: false
            };
            interactables.push(mashHitBox);
            scene.add(mashHitBox);

            const outlineGeo = new THREE.EdgesGeometry(hitBoxGeo);
            const outlineMat = new THREE.LineBasicMaterial({ color: 0x3b82f6, linewidth: 2, transparent: true, opacity: 0 });
            const outline = new THREE.LineSegments(outlineGeo, outlineMat);
            outline.position.y = 10;
            scene.add(outline);

            function safeId(key) { return key.replace(/[^a-zA-Z0-9]/g, ''); }

            function onMouseMove(event) {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            }

            function clearDetailsPanel() {
                var panel = document.getElementById('details-panel');
                var eqName = document.getElementById('eq-name');
                var eqStatus = document.getElementById('eq-status');
                var eqData = document.getElementById('eq-data-container');
                if (panel) panel.style.opacity = '0.5';
                if (eqName) eqName.innerText = "Inspecionar Equipamento";
                if (eqStatus) { eqStatus.innerText = "---"; eqStatus.className = "text-xs text-slate-400"; }
                if (eqData) eqData.innerHTML = '<div class="text-slate-400 text-xs italic py-4 text-center">Clique no tanque para ver os dados.</div>';
            }

            function onClick(event) {
                if (hoveredObject) {
                    selectedObject = hoveredObject;
                    updateHUDDetails(selectedObject.userData);
                } else {
                    selectedObject = null;
                    outline.material.opacity = 0;
                    clearDetailsPanel();
                }
            }

            window.addEventListener('mousemove', onMouseMove, false);
            window.addEventListener('click', onClick, false);

            function updateHUDDetails(userData) {
                var panel = document.getElementById('details-panel');
                var eqName = document.getElementById('eq-name');
                var eqStatus = document.getElementById('eq-status');
                var eqData = document.getElementById('eq-data-container');
                if (!userData || !eqName || !eqStatus || !eqData) return;
                if (panel) panel.style.opacity = '1';
                eqName.innerText = userData.name;
                var html = '';
                for (var key in userData.data) {
                    if (!userData.data.hasOwnProperty(key)) continue;
                    var value = userData.data[key];
                    var valClass = "val";
                    if (key === "Status Agitador" && value === "ON") valClass = "val-blue";
                    if (key === "Nível do Tanque") valClass = "val-warn";
                    html += '<div class="data-row"><span>' + key + ':</span> <span class="' + valClass + '" id="dyn-' + safeId(key) + '">' + value + '</span></div>';
                }
                eqStatus.innerText = "MASHING";
                eqStatus.className = "text-xs text-blue-400 font-bold";
                eqData.innerHTML = html;
            }

            function animate() {
                requestAnimationFrame(animate);
                controls.update();

                raycaster.setFromCamera(mouse, camera);
                var intersects = raycaster.intersectObjects(interactables);
                if (intersects.length > 0) {
                    if (hoveredObject !== intersects[0].object) {
                        hoveredObject = intersects[0].object;
                        document.body.style.cursor = 'pointer';
                        if (!selectedObject) outline.material.opacity = 0.3;
                    }
                } else {
                    hoveredObject = null;
                    document.body.style.cursor = 'default';
                    if (!selectedObject) outline.material.opacity = 0;
                }
                if (selectedObject) outline.material.opacity = 0.8;

                motorShaft.rotation.y += 0.2;

                renderer.render(scene, camera);
            }

            animate();

            window.addEventListener('resize', function () {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }, false);

            setInterval(function () {
                if (!selectedObject) return;
                var tempEl = document.getElementById('dyn-TemperaturaMash');
                if (tempEl) {
                    var temp = 62.0 + (Math.random() * 0.4 - 0.2);
                    tempEl.innerText = temp.toFixed(1) + " °C";
                }
                var flowEl = document.getElementById('dyn-Fluxodegua');
                if (flowEl) {
                    var flow = 42 + Math.floor(Math.random() * 3 - 1);
                    flowEl.innerText = flow + " L/min";
                }
            }, 2000);
        };
    </script>
</body>
</html>
