<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <title>Digital Twin 3D - Sistema CIP</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }

        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 1.5rem; box-sizing: border-box;
        }
        .panel {
            background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(8px);
            border: 1px solid rgba(71, 85, 105, 0.8); border-radius: 12px;
            padding: 1rem; pointer-events: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .data-row { display: flex; justify-content: space-between; font-family: monospace; font-size: 0.85rem; margin-top: 0.5rem; color: #cbd5e1; border-bottom: 1px solid #334155; padding-bottom: 0.2rem;}
        .val { color: #10b981; font-weight: bold; }
        .val-warn { color: #f59e0b; font-weight: bold; }
        .val-alert { color: #ef4444; font-weight: bold; animation: pulse-text 1s infinite; }
        .val-blue { color: #3b82f6; font-weight: bold; }
        .val-neutral { color: #94a3b8; font-weight: bold; }
        .val-purple { color: #a855f7; font-weight: bold; }

        @keyframes pulse-text {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="flex justify-between items-start">
            <div class="panel max-w-sm border-green-500/50 shadow-[0_0_15px_rgba(34,197,94,0.3)]">
                <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></span>
                    Sistema CIP 3D (Clean-In-Place)
                </h1>
                <p class="text-slate-400 text-xs mt-1">Foco Detalhado (FBE_09). Clique no equipamento para ler a telemetria.</p>
            </div>

            <div class="panel w-64 border-green-500/50">
                <h2 class="text-white font-bold text-sm mb-2 border-b border-slate-600 pb-1">STATUS DO CIP</h2>
                <div class="data-row"><span>Bomba CIP:</span> <span class="val-blue" id="hud-pump">ON</span></div>
                <div class="data-row"><span>Nível Soda (Caustic):</span> <span class="val-warn"><span id="hud-caustic">39</span> %</span></div>
                <div class="data-row border-0"><span>Nível Ácido:</span> <span class="val-alert"><span id="hud-acid">17</span> %</span></div>
            </div>
        </div>

        <div class="flex justify-end items-end">
            <div id="details-panel" class="panel w-80" style="opacity: 0.5;">
                <h2 class="text-white font-bold text-sm mb-2 border-b border-slate-600 pb-1 flex justify-between">
                    <span id="eq-name">Inspecionar Equipamento</span>
                    <span id="eq-status" class="text-xs text-slate-400">---</span>
                </h2>
                <div id="eq-data-container">
                    <div class="text-slate-400 text-xs italic py-4 text-center">Clique no skid do CIP para ver os dados.</div>
                </div>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        (function() {
            var FBE_ID = 9;
            var HUD_MAP = { "return_conduct": "hud-cond", "caustic_tank_lvl": "hud-caustic", "acid_tank_lvl": "hud-acid", "cip_pump_state": "hud-pump" };
            function escapeHtml(s) { if (!s) return ""; var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
            window.addEventListener("message", function(e) {
                if (e.origin !== window.location.origin || !e.data || e.data.type !== "fbe_facts" || e.data.fbeId !== FBE_ID) return;
                var facts = e.data.facts || [];
                var c = document.getElementById("eq-data-container");
                if (c) {
                    var html = "";
                    for (var i = 0; i < facts.length; i++) {
                        html += "<div class=\"data-row\"><span>" + escapeHtml(facts[i].label) + "</span> <span class=\"val\">" + escapeHtml(facts[i].value) + "</span></div>";
                    }
                    c.innerHTML = html || "<div class=\"text-slate-400 text-xs italic py-4 text-center\">Dados em tempo real (Smart Brewery).</div>";
                }
                for (var j = 0; j < facts.length; j++) {
                    var id = HUD_MAP[facts[j].label];
                    if (id) { var el = document.getElementById(id); if (el) el.textContent = facts[j].value; }
                }
            });
        })();
        window.onload = function () {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.FogExp2(0x0f172a, 0.012);

            const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 18, 45);

            const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.01;
            controls.target.set(0, 5, 0);

            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let hoveredObject = null;
            let selectedObject = null;
            const interactables = [];

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 40, 30);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);
            const blueLight = new THREE.PointLight(0x3b82f6, 0.6, 60);
            blueLight.position.set(-20, 20, 20);
            scene.add(blueLight);
            const greenLight = new THREE.PointLight(0x22c55e, 0.8, 40);
            greenLight.position.set(10, 10, 15);
            scene.add(greenLight);

            const matFloor = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8, metalness: 0.2 });
            const matSteel = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.35, metalness: 0.85 });
            const matDarkSteel = new THREE.MeshStandardMaterial({ color: 0x27303f, roughness: 0.6, metalness: 0.5 });
            const matMotor = new THREE.MeshStandardMaterial({ color: 0x1d4ed8, roughness: 0.4, metalness: 0.4 });
            const matCaustic = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3, metalness: 0.1 });
            const matAcid = new THREE.MeshStandardMaterial({ color: 0xa855f7, roughness: 0.3, metalness: 0.1 });
            const matWater = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.3, metalness: 0.1 });
            const matGlass = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.3, roughness: 0.1 });

            const floor = new THREE.Mesh(new THREE.BoxGeometry(60, 1, 30), matFloor);
            floor.position.y = -0.5;
            floor.receiveShadow = true;
            scene.add(floor);
            const gridHelper = new THREE.GridHelper(60, 30, 0x334155, 0x334155);
            scene.add(gridHelper);

            const cipGroup = new THREE.Group();
            scene.add(cipGroup);

            var skid = new THREE.Mesh(new THREE.BoxGeometry(26, 0.8, 10), matDarkSteel);
            skid.position.y = 0.4;
            skid.castShadow = true;
            skid.receiveShadow = true;
            cipGroup.add(skid);

            var tankRadius = 3;
            var tankHeight = 8;
            var tankY = 5.5;

            function createCIPTank(xPos, zPos, labelColorMat, liquidMat, liquidLevelPercentage) {
                var group = new THREE.Group();
                group.position.set(xPos, 0, zPos);
                for (var i = 0; i < 4; i++) {
                    var leg = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1.5, 16), matDarkSteel);
                    leg.position.set(Math.cos(i * Math.PI / 2) * 2.2, 1.5, Math.sin(i * Math.PI / 2) * 2.2);
                    group.add(leg);
                }
                var bottom = new THREE.Mesh(new THREE.SphereGeometry(tankRadius, 32, 16, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), matSteel);
                bottom.position.y = tankY - tankHeight / 2;
                group.add(bottom);
                var body = new THREE.Mesh(new THREE.CylinderGeometry(tankRadius, tankRadius, tankHeight, 64), matSteel);
                body.position.y = tankY;
                body.castShadow = true;
                body.receiveShadow = true;
                group.add(body);
                var band = new THREE.Mesh(new THREE.CylinderGeometry(tankRadius + 0.05, tankRadius + 0.05, 1.5, 64), labelColorMat);
                band.position.y = tankY + 2;
                group.add(band);
                var dome = new THREE.Mesh(new THREE.SphereGeometry(tankRadius, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), matSteel);
                dome.position.y = tankY + tankHeight / 2;
                group.add(dome);
                var manway = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.2, 16), matDarkSteel);
                manway.position.set(1.5, tankY + tankHeight / 2 + 0.8, 1.5);
                manway.rotation.x = Math.PI / 6;
                manway.rotation.z = -Math.PI / 6;
                group.add(manway);
                var sgGroup = new THREE.Group();
                sgGroup.position.set(0, tankY, tankRadius + 0.2);
                var sgBg = new THREE.Mesh(new THREE.BoxGeometry(0.6, 6, 0.1), matDarkSteel);
                var sgTube = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 5.8, 16), matGlass);
                sgTube.position.z = 0.1;
                sgGroup.add(sgBg, sgTube);
                if (liquidLevelPercentage > 0) {
                    var liqHeight = 5.8 * (liquidLevelPercentage / 100);
                    var liquid = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, liqHeight, 16), liquidMat);
                    liquid.position.set(0, (-5.8 / 2) + (liqHeight / 2), 0.1);
                    sgGroup.add(liquid);
                }
                var connTop = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.4, 8), matDarkSteel);
                connTop.rotation.x = Math.PI / 2;
                connTop.position.set(0, 2.9, -0.1);
                var connBot = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.4, 8), matDarkSteel);
                connBot.rotation.x = Math.PI / 2;
                connBot.position.set(0, -2.9, -0.1);
                sgGroup.add(connTop, connBot);
                group.add(sgGroup);
                var outlet = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1, 16), matSteel);
                outlet.position.y = 1.5;
                group.add(outlet);
                return group;
            }

            var tankWater = createCIPTank(-8.5, -1, matWater, matWater, 80);
            cipGroup.add(tankWater);
            var tankCaustic = createCIPTank(0, -1, matCaustic, matCaustic, 39);
            cipGroup.add(tankCaustic);
            var tankAcid = createCIPTank(8.5, -1, matAcid, matAcid, 17);
            cipGroup.add(tankAcid);

            var pumpGroup = new THREE.Group();
            pumpGroup.position.set(0, 1.5, 3.5);
            var pumpBase = new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 3), matDarkSteel);
            pumpGroup.add(pumpBase);
            var volute = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), matDarkSteel);
            volute.position.set(0, 1, 1);
            volute.scale.z = 0.5;
            pumpGroup.add(volute);
            var motor = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 2, 32), matMotor);
            motor.rotation.x = Math.PI / 2;
            motor.position.set(0, 1, -0.5);
            motor.castShadow = true;
            pumpGroup.add(motor);
            var shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1, 16), matSteel);
            shaft.rotation.x = Math.PI / 2;
            shaft.position.set(0, 1, 0.5);
            pumpGroup.add(shaft);
            var fanCover = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 0.5, 16), matDarkSteel);
            fanCover.rotation.x = Math.PI / 2;
            fanCover.position.set(0, 1, -1.5);
            pumpGroup.add(fanCover);
            cipGroup.add(pumpGroup);

            var headerPipe = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 18, 16), matSteel);
            headerPipe.rotation.z = Math.PI / 2;
            headerPipe.position.set(0, 2.5, 2);
            headerPipe.castShadow = true;
            cipGroup.add(headerPipe);
            [-8.5, 0, 8.5].forEach(function (x) {
                var dropPipe = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1, 16), matSteel);
                dropPipe.position.set(x, 2, 0);
                dropPipe.rotation.x = Math.PI / 2;
                dropPipe.position.z = 1;
                var valve = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), matDarkSteel);
                valve.position.set(x, 2.5, 1);
                var actuator = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.8, 16), matSteel);
                actuator.position.set(x, 3.2, 1);
                cipGroup.add(dropPipe, valve, actuator);
            });
            var suctionPipe = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.5, 16), matSteel);
            suctionPipe.rotation.x = Math.PI / 2;
            suctionPipe.position.set(0, 2.5, 3.5);
            cipGroup.add(suctionPipe);

            var returnPipe = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 8, 16), matSteel);
            returnPipe.position.set(11, 6, 2);
            returnPipe.castShadow = true;
            cipGroup.add(returnPipe);
            var conductSensorBox = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), matDarkSteel);
            conductSensorBox.position.set(11, 4, 2);
            var conductLED = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), new THREE.MeshBasicMaterial({ color: 0x10b981 }));
            conductLED.position.set(11.4, 4, 2);
            cipGroup.add(conductSensorBox, conductLED);

            var hmiBox = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 1), matDarkSteel);
            hmiBox.position.set(-11, 5, 4);
            hmiBox.castShadow = true;
            var hmiScreen = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 1.2), new THREE.MeshBasicMaterial({ color: 0x0ea5e9 }));
            hmiScreen.position.set(-11, 5.5, 4.51);
            var hmiLight = new THREE.PointLight(0x0ea5e9, 0.5, 5);
            hmiLight.position.set(-11, 5.5, 5);
            cipGroup.add(hmiLight);
            cipGroup.add(hmiBox, hmiScreen);

            var hitBoxGeo = new THREE.BoxGeometry(27, 12, 12);
            var hitBoxMat = new THREE.MeshBasicMaterial({ visible: false });
            var cipHitBox = new THREE.Mesh(hitBoxGeo, hitBoxMat);
            cipHitBox.position.y = 5.5;
            cipHitBox.userData = {
                id: "fbe09",
                name: "Sistema CIP (Clean-In-Place)",
                data: {
                    "Nível Tanque Soda": "39%",
                    "Nível Tanque Ácido": "17%",
                    "Condutividade Retorno": "3 mS/cm",
                    "Estado Bomba CIP": "ON",
                    "Velocidade do Fluxo": "3 m/s"
                },
                isHighlighted: false
            };
            interactables.push(cipHitBox);
            scene.add(cipHitBox);

            var outlineGeo = new THREE.EdgesGeometry(hitBoxGeo);
            var outlineMat = new THREE.LineBasicMaterial({ color: 0x22c55e, linewidth: 2, transparent: true, opacity: 0 });
            var outline = new THREE.LineSegments(outlineGeo, outlineMat);
            outline.position.y = 5.5;
            scene.add(outline);

            function safeId(key) { return key.replace(/[^a-zA-Z0-9]/g, ''); }

            function onMouseMove(event) {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            }

            function clearDetailsPanel() {
                var panel = document.getElementById('details-panel');
                var eqName = document.getElementById('eq-name');
                var eqStatus = document.getElementById('eq-status');
                var eqData = document.getElementById('eq-data-container');
                if (panel) panel.style.opacity = '0.5';
                if (eqName) eqName.innerText = "Inspecionar Equipamento";
                if (eqStatus) { eqStatus.innerText = "---"; eqStatus.className = "text-xs text-slate-400"; }
                if (eqData) eqData.innerHTML = '<div class="text-slate-400 text-xs italic py-4 text-center">Clique no skid do CIP para ver os dados.</div>';
            }

            function onClick(event) {
                if (hoveredObject) {
                    selectedObject = hoveredObject;
                    updateHUDDetails(selectedObject.userData);
                } else {
                    selectedObject = null;
                    outline.material.opacity = 0;
                    clearDetailsPanel();
                }
            }

            window.addEventListener('mousemove', onMouseMove, false);
            window.addEventListener('click', onClick, false);

            function updateHUDDetails(userData) {
                var panel = document.getElementById('details-panel');
                var eqName = document.getElementById('eq-name');
                var eqStatus = document.getElementById('eq-status');
                var eqData = document.getElementById('eq-data-container');
                if (!userData || !eqName || !eqStatus || !eqData) return;
                if (panel) panel.style.opacity = '1';
                eqName.innerText = userData.name;
                var html = '';
                for (var key in userData.data) {
                    if (!userData.data.hasOwnProperty(key)) continue;
                    var value = userData.data[key];
                    var valClass = "val";
                    if (key.indexOf("Soda") !== -1) valClass = "val-warn";
                    if (key.indexOf("Ácido") !== -1) valClass = "val-alert";
                    if (key.indexOf("Condutividade") !== -1) valClass = "val-neutral";
                    if (key.indexOf("Bomba") !== -1 && value === "ON") valClass = "val-blue";
                    html += '<div class="data-row"><span>' + key + ':</span> <span class="' + valClass + '" id="dyn-' + safeId(key) + '">' + value + '</span></div>';
                }
                eqStatus.innerText = "CLEANING ACTIVE";
                eqStatus.className = "text-xs text-green-400 font-bold animate-pulse";
                eqData.innerHTML = html;
            }

            function animate() {
                requestAnimationFrame(animate);
                controls.update();

                raycaster.setFromCamera(mouse, camera);
                var intersects = raycaster.intersectObjects(interactables);
                if (intersects.length > 0) {
                    if (hoveredObject !== intersects[0].object) {
                        hoveredObject = intersects[0].object;
                        document.body.style.cursor = 'pointer';
                        if (!selectedObject) outline.material.opacity = 0.3;
                    }
                } else {
                    hoveredObject = null;
                    document.body.style.cursor = 'default';
                    if (!selectedObject) outline.material.opacity = 0;
                }
                if (selectedObject) outline.material.opacity = 0.8;

                shaft.rotation.y += 0.5;

                renderer.render(scene, camera);
            }

            animate();

            window.addEventListener('resize', function () {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }, false);

            setInterval(function () {
                var currentCaustic = 39 - Math.floor(Math.random() * 2);
                if (currentCaustic < 0) currentCaustic = 0;
                var currentAcid = 17 - Math.floor(Math.random() * 2);
                if (currentAcid < 0) currentAcid = 0;
                var hudCaustic = document.getElementById('hud-caustic');
                var hudAcid = document.getElementById('hud-acid');
                if (hudCaustic) hudCaustic.innerText = currentCaustic;
                if (hudAcid) hudAcid.innerText = currentAcid;

                if (selectedObject) {
                    var elCaustic = document.getElementById('dyn-NvelTanqueSoda');
                    if (elCaustic) elCaustic.innerText = currentCaustic + "%";
                    var elAcid = document.getElementById('dyn-NvelTanquecido');
                    if (elAcid) elAcid.innerText = currentAcid + "%";
                    var elConduct = document.getElementById('dyn-CondutividadeRetorno');
                    if (elConduct) {
                        var cond = 3.0 + (Math.random() * 0.2 - 0.1);
                        elConduct.innerText = cond.toFixed(2) + " mS/cm";
                    }
                    var elFlow = document.getElementById('dyn-VelocidadedoFluxo');
                    if (elFlow) {
                        var flow = 3.0 + (Math.random() * 0.1 - 0.05);
                        elFlow.innerText = flow.toFixed(1) + " m/s";
                    }
                }
            }, 2000);
        };
    </script>
</body>
</html>
