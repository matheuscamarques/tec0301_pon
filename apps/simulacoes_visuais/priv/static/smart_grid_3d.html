<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <title>Digital Twin 3D - Smart Grid</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }

        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 1.5rem; box-sizing: border-box;
        }
        .panel {
            background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(8px);
            border: 1px solid rgba(71, 85, 105, 0.8); border-radius: 12px;
            padding: 1rem; pointer-events: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .data-row { display: flex; justify-content: space-between; font-family: monospace; font-size: 0.85rem; margin-top: 0.5rem; color: #cbd5e1; border-bottom: 1px solid #334155; padding-bottom: 0.2rem;}
        .val { color: #10b981; font-weight: bold; }
        .val-warn { color: #f59e0b; font-weight: bold; }
        .val-alert { color: #ef4444; font-weight: bold; animation: pulse-alert 1s infinite; }
        .val-blue { color: #3b82f6; font-weight: bold; }

        @keyframes pulse-alert {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="flex justify-between items-start">
            <div class="panel max-w-sm border-blue-500/50 shadow-[0_0_15px_rgba(59,130,246,0.2)]">
                <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></span>
                    Smart Grid 3D
                </h1>
                <p class="text-slate-400 text-xs mt-1">Foco Detalhado (FBE_11). Gestão Energética Bidirecional.</p>
            </div>

            <div class="panel w-64 border-blue-500/50">
                <h2 class="text-white font-bold text-sm mb-2 border-b border-slate-600 pb-1">ESTADO DA REDE</h2>
                <div class="data-row"><span>Carga Principal:</span> <span class="val-blue"><span id="hud-load">73</span> kW</span></div>
                <div class="data-row"><span>Custo Energia:</span> <span class="val-warn"><span id="hud-cost">161</span> ¢</span></div>
                <div class="data-row border-0"><span>Bateria V2G:</span> <span class="val-alert"><span id="hud-v2g">16</span> %</span></div>
            </div>
        </div>

        <div class="flex justify-end items-end">
            <div id="details-panel" class="panel w-80" style="opacity: 0.5;">
                <h2 class="text-white font-bold text-sm mb-2 border-b border-slate-600 pb-1 flex justify-between">
                    <span id="eq-name">Inspecionar Rede</span>
                    <span id="eq-status" class="text-xs text-slate-400">---</span>
                </h2>
                <div id="eq-data-container">
                    <div class="text-slate-400 text-xs italic py-4 text-center">Clique nos componentes da rede para ler a telemetria.</div>
                </div>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        (function() {
            var FBE_ID = 11;
            var HUD_MAP = { "main_load_draw": "hud-load", "grid_power_cost": "hud-cost", "v2g_battery_lvl": "hud-v2g" };
            function escapeHtml(s) { if (!s) return ""; var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
            window.addEventListener("message", function(e) {
                if (e.origin !== window.location.origin || !e.data || e.data.type !== "fbe_facts" || e.data.fbeId !== FBE_ID) return;
                var facts = e.data.facts || [];
                var c = document.getElementById("eq-data-container");
                if (c) {
                    var html = "";
                    for (var i = 0; i < facts.length; i++) {
                        html += "<div class=\"data-row\"><span>" + escapeHtml(facts[i].label) + "</span> <span class=\"val\">" + escapeHtml(facts[i].value) + "</span></div>";
                    }
                    c.innerHTML = html || "<div class=\"text-slate-400 text-xs italic py-4 text-center\">Dados em tempo real (Smart Brewery).</div>";
                }
                for (var j = 0; j < facts.length; j++) {
                    var id = HUD_MAP[facts[j].label];
                    if (id) { var el = document.getElementById(id); if (el) el.textContent = facts[j].value; }
                }
            });
        })();
        window.onload = function () {
            var container = document.getElementById('canvas-container');
            var scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.FogExp2(0x0f172a, 0.01);

            var camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(40, 25, 45);

            var renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            var controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2.1;
            controls.target.set(0, 5, 0);

            var raycaster = new THREE.Raycaster();
            var mouse = new THREE.Vector2();
            var hoveredObject = null;
            var selectedObject = null;
            var interactables = [];

            var ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            var dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 50, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            scene.add(dirLight);
            var blueLight = new THREE.PointLight(0x3b82f6, 1.5, 60);
            blueLight.position.set(-15, 15, 15);
            scene.add(blueLight);
            var yellowLight = new THREE.PointLight(0xeab308, 1.0, 40);
            yellowLight.position.set(15, 10, -15);
            scene.add(yellowLight);

            var matFloor = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8, metalness: 0.2 });
            var matSteel = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.3, metalness: 0.8 });
            var matDarkSteel = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.6, metalness: 0.5 });
            var matSolar = new THREE.MeshStandardMaterial({ color: 0x1e3a8a, roughness: 0.2, metalness: 0.5 });
            var matBattery = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.5 });
            var matAlert = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xef4444, emissiveIntensity: 1 });

            var floor = new THREE.Mesh(new THREE.CylinderGeometry(40, 40, 1, 64), matFloor);
            floor.position.y = -0.5;
            floor.receiveShadow = true;
            scene.add(floor);
            var gridHelper = new THREE.GridHelper(80, 40, 0x334155, 0x334155);
            scene.add(gridHelper);

            var gridGroup = new THREE.Group();
            scene.add(gridGroup);

            var fbeData = {
                id: "fbe11",
                name: "Smart Grid Central",
                data: {
                    "Custo Energia": "161 ¢/kWh",
                    "Bateria V2G": "16%",
                    "Carga Principal": "73 kW",
                    "Falhas na Rede": "FALSE"
                }
            };

            var turbineGroup = new THREE.Group();
            turbineGroup.position.set(-15, 0, -10);
            var mast = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 1.2, 25, 16), matSteel);
            mast.position.y = 12.5;
            mast.castShadow = true;
            turbineGroup.add(mast);
            var nacelle = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 4), matSteel);
            nacelle.position.set(0, 25, 0);
            turbineGroup.add(nacelle);
            var rotorGroup = new THREE.Group();
            rotorGroup.position.set(0, 25, 2.2);
            var hub = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), matSteel);
            rotorGroup.add(hub);
            for (var i = 0; i < 3; i++) {
                var blade = new THREE.Mesh(new THREE.BoxGeometry(0.2, 10, 0.8), matSteel);
                blade.position.y = 5;
                var pivot = new THREE.Group();
                pivot.rotation.z = (Math.PI * 2 / 3) * i;
                pivot.add(blade);
                rotorGroup.add(pivot);
            }
            turbineGroup.add(rotorGroup);
            gridGroup.add(turbineGroup);

            var solarGroup = new THREE.Group();
            solarGroup.position.set(15, 0, -10);
            for (var row = 0; row < 2; row++) {
                for (var col = 0; col < 3; col++) {
                    var pFrame = new THREE.Mesh(new THREE.BoxGeometry(4, 0.2, 6), matDarkSteel);
                    var pCells = new THREE.Mesh(new THREE.PlaneGeometry(3.8, 5.8), matSolar);
                    pCells.rotation.x = -Math.PI / 2;
                    pCells.position.y = 0.11;
                    var panel = new THREE.Group();
                    panel.add(pFrame, pCells);
                    panel.rotation.x = -Math.PI / 6;
                    panel.position.set(col * 5 - 5, 2, row * 7);
                    solarGroup.add(panel);
                    var pLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2, 8), matDarkSteel);
                    pLeg.position.set(col * 5 - 5, 1, row * 7);
                    solarGroup.add(pLeg);
                }
            }
            gridGroup.add(solarGroup);

            var essGroup = new THREE.Group();
            essGroup.position.set(-10, 0, 15);
            var batteryContainer = new THREE.Mesh(new THREE.BoxGeometry(8, 5, 4), matBattery);
            batteryContainer.position.y = 2.5;
            batteryContainer.castShadow = true;
            essGroup.add(batteryContainer);
            var ledStrip = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.5, 0.5), matAlert);
            ledStrip.position.set(4.05, 3, 1);
            essGroup.add(ledStrip);
            var vent = new THREE.Mesh(new THREE.BoxGeometry(6, 1, 0.2), matDarkSteel);
            vent.position.set(0, 1.5, 2.01);
            essGroup.add(vent);
            gridGroup.add(essGroup);

            var subStation = new THREE.Group();
            subStation.position.set(12, 0, 15);
            var subBody = new THREE.Mesh(new THREE.BoxGeometry(6, 4, 6), matDarkSteel);
            subBody.position.y = 2;
            subStation.add(subBody);
            var insulatorGeo = new THREE.CylinderGeometry(0.2, 0.4, 1.5, 8);
            for (var i = -1; i <= 1; i++) {
                var ins = new THREE.Mesh(insulatorGeo, matSteel);
                ins.position.set(i * 1.5, 4.5, 0);
                subStation.add(ins);
            }
            gridGroup.add(subStation);

            var hitBoxGeo = new THREE.BoxGeometry(45, 30, 45);
            var hitBox = new THREE.Mesh(hitBoxGeo, new THREE.MeshBasicMaterial({ visible: false }));
            hitBox.position.y = 10;
            hitBox.userData = fbeData;
            interactables.push(hitBox);
            scene.add(hitBox);

            var outlineGeo = new THREE.EdgesGeometry(hitBoxGeo);
            var outlineMat = new THREE.LineBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0 });
            var outline = new THREE.LineSegments(outlineGeo, outlineMat);
            outline.position.y = 10;
            scene.add(outline);

            var flowParticles = new THREE.Group();
            var pGeo = new THREE.SphereGeometry(0.2, 8, 8);
            var pMat = new THREE.MeshBasicMaterial({ color: 0xeab308, transparent: true, opacity: 0.8 });

            function createPowerPath(start, end, count) {
                for (var i = 0; i < count; i++) {
                    var p = new THREE.Mesh(pGeo, pMat);
                    p.userData = {
                        start: start.clone(),
                        end: end.clone(),
                        progress: Math.random(),
                        speed: 0.005 + Math.random() * 0.005
                    };
                    flowParticles.add(p);
                }
            }
            createPowerPath(new THREE.Vector3(-15, 2, -10), new THREE.Vector3(0, 2, 5), 10);
            createPowerPath(new THREE.Vector3(15, 2, -10), new THREE.Vector3(0, 2, 5), 10);
            createPowerPath(new THREE.Vector3(0, 2, 5), new THREE.Vector3(-10, 2, 15), 5);
            createPowerPath(new THREE.Vector3(0, 2, 5), new THREE.Vector3(12, 2, 15), 5);
            scene.add(flowParticles);

            var clock = new THREE.Clock();

            function safeId(key) { return key.replace(/[^a-zA-Z0-9]/g, ''); }

            function onMouseMove(event) {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            }

            function clearDetailsPanel() {
                var panel = document.getElementById('details-panel');
                var eqName = document.getElementById('eq-name');
                var eqStatus = document.getElementById('eq-status');
                var eqData = document.getElementById('eq-data-container');
                if (panel) panel.style.opacity = '0.5';
                if (eqName) eqName.innerText = "Inspecionar Rede";
                if (eqStatus) { eqStatus.innerText = "---"; eqStatus.className = "text-xs text-slate-400"; }
                if (eqData) eqData.innerHTML = '<div class="text-slate-400 text-xs italic py-4 text-center">Clique nos componentes da rede para ler a telemetria.</div>';
            }

            function onClick(event) {
                if (hoveredObject) {
                    selectedObject = hoveredObject;
                    updateHUDDetails(selectedObject.userData);
                } else {
                    selectedObject = null;
                    outline.material.opacity = 0;
                    clearDetailsPanel();
                }
            }

            window.addEventListener('mousemove', onMouseMove, false);
            window.addEventListener('click', onClick, false);

            function updateHUDDetails(userData) {
                var panel = document.getElementById('details-panel');
                var eqName = document.getElementById('eq-name');
                var eqStatus = document.getElementById('eq-status');
                var eqData = document.getElementById('eq-data-container');
                if (!userData || !eqName || !eqStatus || !eqData) return;
                if (panel) panel.style.opacity = '1';
                eqName.innerText = userData.name;
                var html = '';
                for (var key in userData.data) {
                    if (!userData.data.hasOwnProperty(key)) continue;
                    var value = userData.data[key];
                    var valClass = "val";
                    if (key === "Bateria V2G") valClass = "val-alert";
                    if (key === "Custo Energia") valClass = "val-warn";
                    if (key === "Carga Principal") valClass = "val-blue";
                    html += '<div class="data-row"><span>' + key + ':</span> <span class="' + valClass + '" id="dyn-' + safeId(key) + '">' + value + '</span></div>';
                }
                eqStatus.innerText = "ONLINE";
                eqStatus.className = "text-xs text-green-400 font-bold";
                eqData.innerHTML = html;
            }

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                var elapsed = clock.getElapsedTime();

                raycaster.setFromCamera(mouse, camera);
                var intersects = raycaster.intersectObjects(interactables);
                if (intersects.length > 0) {
                    if (hoveredObject !== intersects[0].object) {
                        hoveredObject = intersects[0].object;
                        document.body.style.cursor = 'pointer';
                        if (!selectedObject) outline.material.opacity = 0.3;
                    }
                } else {
                    hoveredObject = null;
                    document.body.style.cursor = 'default';
                    if (!selectedObject) outline.material.opacity = 0;
                }
                if (selectedObject) outline.material.opacity = 0.8;

                rotorGroup.rotation.z -= 0.05;
                matAlert.emissiveIntensity = 0.5 + Math.sin(elapsed * 4) * 0.5;

                for (var j = 0; j < flowParticles.children.length; j++) {
                    var pt = flowParticles.children[j];
                    pt.userData.progress += pt.userData.speed;
                    if (pt.userData.progress > 1) pt.userData.progress = 0;
                    pt.position.lerpVectors(pt.userData.start, pt.userData.end, pt.userData.progress);
                }

                renderer.render(scene, camera);
            }

            animate();

            window.addEventListener('resize', function () {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }, false);

            setInterval(function () {
                var hLoad = document.getElementById('hud-load');
                var hCost = document.getElementById('hud-cost');
                if (hLoad) {
                    var loadVal = 73 + Math.floor(Math.random() * 6 - 3);
                    hLoad.innerText = loadVal;
                }
                if (hCost) {
                    var costVal = 161 + Math.floor(Math.random() * 4 - 2);
                    hCost.innerText = costVal;
                }
                if (selectedObject) {
                    var elLoad = document.getElementById('dyn-CargaPrincipal');
                    var hLoadEl = document.getElementById('hud-load');
                    if (elLoad && hLoadEl) elLoad.innerText = hLoadEl.innerText + " kW";
                    var elCost = document.getElementById('dyn-CustoEnergia');
                    var hCostEl = document.getElementById('hud-cost');
                    if (elCost && hCostEl) elCost.innerText = hCostEl.innerText + " ¢/kWh";
                }
            }, 3000);
        };
    </script>
</body>
</html>
