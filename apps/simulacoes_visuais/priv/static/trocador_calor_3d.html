<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <title>Digital Twin 3D - Trocador de Calor Detalhado</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }

        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 1.5rem; box-sizing: border-box;
        }
        .panel {
            background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(8px);
            border: 1px solid rgba(71, 85, 105, 0.8); border-radius: 12px;
            padding: 1rem; pointer-events: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .data-row { display: flex; justify-content: space-between; font-family: monospace; font-size: 0.85rem; margin-top: 0.5rem; color: #cbd5e1; border-bottom: 1px solid #334155; padding-bottom: 0.2rem;}
        .val { color: #10b981; font-weight: bold; }
        .val-warn { color: #f59e0b; font-weight: bold; }
        .val-alert { color: #ef4444; font-weight: bold; }
        .val-blue { color: #3b82f6; font-weight: bold; }
        .val-neutral { color: #94a3b8; font-weight: bold; }
    </style>
</head>
<body>

    <div id="hud">
        <div class="flex justify-between items-start">
            <div class="panel max-w-sm">
                <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></span>
                    Trocador de Calor 3D
                </h1>
                <p class="text-slate-400 text-xs mt-1">Foco Detalhado (FBE_05). Clique no equipamento para ler a telemetria.</p>
            </div>

            <div class="panel w-64">
                <h2 class="text-white font-bold text-sm mb-2 border-b border-slate-600 pb-1">STATUS DO ARREFECIMENTO</h2>
                <div class="data-row"><span>Mosto (Out):</span> <span class="val-blue"><span id="hud-temp-out">11.0</span> °C</span></div>
                <div class="data-row"><span>Válvula Glicol:</span> <span class="val"><span id="hud-valve">40</span> %</span></div>
                <div class="data-row border-0"><span>Pressão Água:</span> <span class="val-neutral"><span id="hud-press">3.0</span> bar</span></div>
            </div>
        </div>

        <div class="flex justify-end items-end">
            <div id="details-panel" class="panel w-80" style="opacity: 0.5;">
                <h2 class="text-white font-bold text-sm mb-2 border-b border-slate-600 pb-1 flex justify-between">
                    <span id="eq-name">Inspecionar Equipamento</span>
                    <span id="eq-status" class="text-xs text-slate-400">---</span>
                </h2>
                <div id="eq-data-container">
                    <div class="text-slate-400 text-xs italic py-4 text-center">Clique no trocador para ver os dados.</div>
                </div>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        (function() {
            var FBE_ID = 5;
            var HUD_MAP = { "wort_out_temp": "hud-temp-out", "glycol_valve_pos": "hud-valve", "water_pressure": "hud-press" };
            window.__fbeFacts = {};
            function escapeHtml(s) { if (!s) return ""; var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
            window.addEventListener("message", function(e) {
                if (e.origin !== window.location.origin || !e.data || e.data.type !== "fbe_facts" || e.data.fbeId !== FBE_ID) return;
                var facts = e.data.facts || [];
                window.__fbeFacts = {};
                for (var j = 0; j < facts.length; j++) {
                    window.__fbeFacts[facts[j].label] = facts[j].value;
                    var id = HUD_MAP[facts[j].label];
                    if (id) { var el = document.getElementById(id); if (el) el.textContent = facts[j].value; }
                }
                var c = document.getElementById("eq-data-container");
                if (c) {
                    var html = "";
                    for (var i = 0; i < facts.length; i++) {
                        html += "<div class=\"data-row\"><span>" + escapeHtml(facts[i].label) + "</span> <span class=\"val\">" + escapeHtml(facts[i].value) + "</span></div>";
                    }
                    c.innerHTML = html || "<div class=\"text-slate-400 text-xs italic py-4 text-center\">Dados em tempo real (Smart Brewery).</div>";
                }
            });
        })();
        window.onload = function () {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.FogExp2(0x0f172a, 0.012);

            const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(30, 20, 35);

            const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.01;
            controls.target.set(0, 6, 0);

            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let hoveredObject = null;
            let selectedObject = null;
            const interactables = [];

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(30, 50, 40);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);
            const blueLight = new THREE.PointLight(0x3b82f6, 1.2, 60);
            blueLight.position.set(-20, 15, 20);
            scene.add(blueLight);
            const whiteLight = new THREE.PointLight(0xffffff, 0.5, 40);
            whiteLight.position.set(20, 10, -20);
            scene.add(whiteLight);

            const matFloor = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8, metalness: 0.2 });
            const matSteel = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.4, metalness: 0.7 });
            const matDarkSteel = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.6, metalness: 0.4 });
            const matPipeWort = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.3, metalness: 0.6 });
            const matPipeGlycol = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.3, metalness: 0.6 });

            const floor = new THREE.Mesh(new THREE.CylinderGeometry(20, 20, 1, 64), matFloor);
            floor.position.y = -0.5;
            floor.receiveShadow = true;
            scene.add(floor);
            const gridHelper = new THREE.GridHelper(40, 20, 0x334155, 0x334155);
            scene.add(gridHelper);

            const heGroup = new THREE.Group();
            scene.add(heGroup);

            const baseMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.9 });
            const heBase = new THREE.Mesh(new THREE.BoxGeometry(6, 1, 14), baseMat);
            heBase.position.y = 0.5;
            heBase.castShadow = true;
            heBase.receiveShadow = true;
            heGroup.add(heBase);

            var frameWidth = 4.5;
            var frameHeight = 9;
            var frameDepth = 1.2;
            var frameY = 5.5;

            var frontPlate = new THREE.Mesh(new THREE.BoxGeometry(frameWidth, frameHeight, frameDepth), matDarkSteel);
            frontPlate.position.set(0, frameY, 6);
            frontPlate.castShadow = true;
            var backPlate = new THREE.Mesh(new THREE.BoxGeometry(frameWidth, frameHeight, frameDepth), matDarkSteel);
            backPlate.position.set(0, frameY, -6);
            backPlate.castShadow = true;
            heGroup.add(frontPlate, backPlate);

            var barGeo = new THREE.CylinderGeometry(0.2, 0.2, 13, 16);
            var topBar = new THREE.Mesh(barGeo, matSteel);
            topBar.rotation.x = Math.PI / 2;
            topBar.position.set(0, frameY + 3.8, 0);
            topBar.castShadow = true;
            var botBar = new THREE.Mesh(barGeo, matSteel);
            botBar.rotation.x = Math.PI / 2;
            botBar.position.set(0, frameY - 3.8, 0);
            botBar.castShadow = true;
            var sideBar1 = new THREE.Mesh(barGeo, matSteel);
            sideBar1.rotation.x = Math.PI / 2;
            sideBar1.position.set(1.8, frameY, 0);
            var sideBar2 = new THREE.Mesh(barGeo, matSteel);
            sideBar2.rotation.x = Math.PI / 2;
            sideBar2.position.set(-1.8, frameY, 0);
            heGroup.add(topBar, botBar, sideBar1, sideBar2);

            var plateWidth = 4;
            var plateHeight = 7.6;
            var plateThickness = 0.1;
            var numPlates = 40;
            var gap = 0.25;
            var platesGroup = new THREE.Group();
            var plateGeo = new THREE.BoxGeometry(plateWidth, plateHeight, plateThickness);
            for (var i = 0; i < numPlates; i++) {
                var plate = new THREE.Mesh(plateGeo, matSteel);
                var zPos = -5 + (i * gap);
                plate.position.set(0, frameY, zPos);
                plate.castShadow = true;
                platesGroup.add(plate);
            }
            heGroup.add(platesGroup);

            var portRadius = 0.6;
            var portLength = 2;
            var portGeo = new THREE.CylinderGeometry(portRadius, portRadius, portLength, 32);
            var portWortIn = new THREE.Mesh(portGeo, matPipeWort);
            portWortIn.rotation.x = Math.PI / 2;
            portWortIn.position.set(-1.2, frameY + 2.5, 6 + portLength / 2);
            portWortIn.castShadow = true;
            var portWortOut = new THREE.Mesh(portGeo, matPipeWort);
            portWortOut.rotation.x = Math.PI / 2;
            portWortOut.position.set(-1.2, frameY - 2.5, 6 + portLength / 2);
            portWortOut.castShadow = true;
            var portGlycolIn = new THREE.Mesh(portGeo, matPipeGlycol);
            portGlycolIn.rotation.x = Math.PI / 2;
            portGlycolIn.position.set(1.2, frameY - 2.5, 6 + portLength / 2);
            portGlycolIn.castShadow = true;
            var matPipeHotWater = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3 });
            var portWaterOut = new THREE.Mesh(portGeo, matPipeHotWater);
            portWaterOut.rotation.x = Math.PI / 2;
            portWaterOut.position.set(1.2, frameY + 2.5, 6 + portLength / 2);
            portWaterOut.castShadow = true;
            var flangeGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.2, 32);
            [portWortIn, portWortOut, portGlycolIn, portWaterOut].forEach(function (port) {
                var flange = new THREE.Mesh(flangeGeo, matDarkSteel);
                flange.rotation.x = Math.PI / 2;
                flange.position.copy(port.position);
                flange.position.z += portLength / 2 - 0.1;
                heGroup.add(flange);
            });
            heGroup.add(portWortIn, portWortOut, portGlycolIn, portWaterOut);

            var hitBoxGeo = new THREE.BoxGeometry(8, 12, 16);
            var hitBoxMat = new THREE.MeshBasicMaterial({ visible: false });
            var heHitBox = new THREE.Mesh(hitBoxGeo, hitBoxMat);
            heHitBox.position.y = 5.5;
            heHitBox.userData = {
                id: "fbe05",
                name: "Trocador de Calor de Placas",
                data: {
                    "Temp. Entrada Mosto": "11.0 °C",
                    "Temp. Saída Mosto": "11.0 °C",
                    "Válvula de Glicol": "40%",
                    "Pressão da Água": "3.0 bar"
                },
                isHighlighted: false
            };
            interactables.push(heHitBox);
            scene.add(heHitBox);

            var outlineGeo = new THREE.EdgesGeometry(hitBoxGeo);
            var outlineMat = new THREE.LineBasicMaterial({ color: 0x3b82f6, linewidth: 2, transparent: true, opacity: 0 });
            var outline = new THREE.LineSegments(outlineGeo, outlineMat);
            outline.position.y = 5.5;
            scene.add(outline);

            var flowParticles = new THREE.Group();
            var pGeo = new THREE.SphereGeometry(0.15, 8, 8);
            function createFlow(x, y, startZ, endZ, colorHex, count) {
                var pMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.8 });
                for (var i = 0; i < count; i++) {
                    var p = new THREE.Mesh(pGeo, pMat);
                    p.position.set(x, y, startZ + Math.random() * (endZ - startZ));
                    p.userData = {
                        startZ: startZ,
                        endZ: endZ,
                        speed: (Math.random() * 0.05 + 0.05) * (startZ > endZ ? -1 : 1)
                    };
                    flowParticles.add(p);
                }
            }
            createFlow(-1.2, frameY + 2.5, 8, 6, 0xfcd34d, 5);
            createFlow(-1.2, frameY - 2.5, 6, 8, 0xfcd34d, 5);
            createFlow(1.2, frameY - 2.5, 8, 6, 0x60a5fa, 5);
            createFlow(1.2, frameY + 2.5, 6, 8, 0xfca5a5, 5);
            scene.add(flowParticles);

            function safeId(key) { return key.replace(/[^a-zA-Z0-9]/g, ''); }

            function onMouseMove(event) {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            }

            function clearDetailsPanel() {
                var panel = document.getElementById('details-panel');
                var eqName = document.getElementById('eq-name');
                var eqStatus = document.getElementById('eq-status');
                var eqData = document.getElementById('eq-data-container');
                if (panel) panel.style.opacity = '0.5';
                if (eqName) eqName.innerText = "Inspecionar Equipamento";
                if (eqStatus) { eqStatus.innerText = "---"; eqStatus.className = "text-xs text-slate-400"; }
                if (eqData) eqData.innerHTML = '<div class="text-slate-400 text-xs italic py-4 text-center">Clique no trocador para ver os dados.</div>';
            }

            function onClick(event) {
                if (hoveredObject) {
                    selectedObject = hoveredObject;
                    updateHUDDetails(selectedObject.userData);
                } else {
                    selectedObject = null;
                    outline.material.opacity = 0;
                    clearDetailsPanel();
                }
            }

            window.addEventListener('mousemove', onMouseMove, false);
            window.addEventListener('click', onClick, false);

            function updateHUDDetails(userData) {
                var panel = document.getElementById('details-panel');
                var eqName = document.getElementById('eq-name');
                var eqStatus = document.getElementById('eq-status');
                var eqData = document.getElementById('eq-data-container');
                if (!userData || !eqName || !eqStatus || !eqData) return;
                if (panel) panel.style.opacity = '1';
                eqName.innerText = userData.name;
                var html = '';
                for (var key in userData.data) {
                    if (!userData.data.hasOwnProperty(key)) continue;
                    var value = userData.data[key];
                    var valClass = "val";
                    if (key.indexOf("Temp") !== -1) valClass = "val-blue";
                    if (key.indexOf("Pressão") !== -1) valClass = "val-neutral";
                    html += '<div class="data-row"><span>' + key + ':</span> <span class="' + valClass + '" id="dyn-' + safeId(key) + '">' + value + '</span></div>';
                }
                eqStatus.innerText = "COOLING";
                eqStatus.className = "text-xs text-blue-400 font-bold";
                eqData.innerHTML = html;
            }

            function animate() {
                requestAnimationFrame(animate);
                controls.update();

                raycaster.setFromCamera(mouse, camera);
                var intersects = raycaster.intersectObjects(interactables);
                if (intersects.length > 0) {
                    if (hoveredObject !== intersects[0].object) {
                        hoveredObject = intersects[0].object;
                        document.body.style.cursor = 'pointer';
                        if (!selectedObject) outline.material.opacity = 0.4;
                    }
                } else {
                    hoveredObject = null;
                    document.body.style.cursor = 'default';
                    if (!selectedObject) outline.material.opacity = 0;
                }
                if (selectedObject) outline.material.opacity = 0.8;

                var waterPressure = parseFloat(window.__fbeFacts && window.__fbeFacts.water_pressure, 10) || 3;
                var valvePos = parseFloat(window.__fbeFacts && window.__fbeFacts.glycol_valve_pos, 10) || 40;
                var speedFactor = 0.5 + (isNaN(waterPressure) ? 0.3 : Math.min(1, waterPressure / 10)) * 0.5;
                flowParticles.children.forEach(function (p) {
                    var s = (p.userData.speed || 0.05) * speedFactor;
                    p.position.z += s;
                    if (p.userData.speed > 0 && p.position.z > p.userData.endZ) p.position.z = p.userData.startZ;
                    else if (p.userData.speed < 0 && p.position.z < p.userData.endZ) p.position.z = p.userData.startZ;
                });

                renderer.render(scene, camera);
            }

            animate();

            window.addEventListener('resize', function () {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }, false);

            setInterval(function () {
                var currentTemp = 11.0 + (Math.random() * 0.2 - 0.1);
                var currentValve = 40 + Math.floor(Math.random() * 3 - 1);
                var currentPress = 3.0 + (Math.random() * 0.2 - 0.1);
                var hudTempOut = document.getElementById('hud-temp-out');
                var hudValve = document.getElementById('hud-valve');
                var hudPress = document.getElementById('hud-press');
                if (hudTempOut) hudTempOut.innerText = currentTemp.toFixed(1);
                if (hudValve) hudValve.innerText = currentValve;
                if (hudPress) hudPress.innerText = currentPress.toFixed(1);

                if (selectedObject) {
                    var elTempIn = document.getElementById('dyn-TempEntradaMosto');
                    if (elTempIn) elTempIn.innerText = (11.0 + (Math.random() * 0.2 - 0.1)).toFixed(1) + " °C";
                    var elTempOut = document.getElementById('dyn-TempSadaMosto');
                    if (elTempOut) elTempOut.innerText = currentTemp.toFixed(1) + " °C";
                    var elValve = document.getElementById('dyn-VlvuladeGlicol');
                    if (elValve) elValve.innerText = currentValve + "%";
                    var elPress = document.getElementById('dyn-PressodaGua');
                    if (elPress) elPress.innerText = currentPress.toFixed(1) + " bar";
                }
            }, 2000);
        };
    </script>
</body>
</html>
